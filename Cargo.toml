[package]
name = "grip"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
home = "0.5"
ignore = "0.4.33"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1.1"

[dev-dependencies]
tempfile = "3"
